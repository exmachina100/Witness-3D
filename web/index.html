<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Witness 3D Push/Pull</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="./src/app/app.css">
</head>
<body>
<div id="app"></div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
    "replicad-opencascadejs": "./node_modules/replicad-opencascadejs/dist/replicad_single.js",
    "@nasedkinpv/opensubdiv-wasm": "./node_modules/@nasedkinpv/opensubdiv-wasm/dist/opensubdiv.mjs",
    "@anthropic-ai/sdk": "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.128.0/+esm"
  }
}
</script>
<script type="module">
import { loadKernel } from './src/Kernel.js';
import { LocalBackend } from './src/app/LocalBackend.js';
import { mount } from './src/app/App.js';

document.getElementById('app').innerHTML = '<div class="loading" style="position:fixed">LOADING THE OPENCASCADE KERNEL (7 MB)…</div>';
console.log('Loading kernel...');
await loadKernel(); // let the loader fetch its own .wasm via locateFile
console.log('Kernel loaded successfully!');

console.log('Mounting app...');
const app = await mount(document.getElementById('app'), new LocalBackend());
window.__w3d = app;
console.log('App mounted!');
</script>
</body>
</html>
