<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Witness 3D</title>
<!-- The app icon: Tiny5's W in the accent (tools/brand/make_icons.py). -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%230f0f11'/><g fill='%23ff4d00'><rect x='6' y='6' width='4' height='4'/><rect x='14' y='6' width='4' height='4'/><rect x='22' y='6' width='4' height='4'/><rect x='6' y='10' width='4' height='4'/><rect x='14' y='10' width='4' height='4'/><rect x='22' y='10' width='4' height='4'/><rect x='6' y='14' width='4' height='4'/><rect x='14' y='14' width='4' height='4'/><rect x='22' y='14' width='4' height='4'/><rect x='10' y='18' width='4' height='4'/><rect x='18' y='18' width='4' height='4'/><rect x='10' y='22' width='4' height='4'/><rect x='18' y='22' width='4' height='4'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="./src/app/app.css">
</head>
<body>
<div id="app"></div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
    "replicad-opencascadejs": "https://cdn.jsdelivr.net/npm/replicad-opencascadejs@1.1.0/dist/replicad_single.js",
    "@nasedkinpv/opensubdiv-wasm": "https://cdn.jsdelivr.net/npm/@nasedkinpv/opensubdiv-wasm@0.3.0/dist/opensubdiv.mjs",
    "@anthropic-ai/sdk": "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.128.0/+esm"
  }
}
</script>
<script type="module">
// The loading screen first (boot.js has no imports), then the kernel and the app behind it.
import { bootHTML, bootProgress } from './src/app/boot.js';

const app = document.getElementById('app');
app.innerHTML = `<div class="loading" style="position:fixed">${bootHTML()}</div>`;
// OpenCascade compiled to WebAssembly: a hosted copy ships it gzipped next to the page
// (occ.gz.wasm); without it the loader fetches its own .wasm beside replicad_single.js.
// The download is read in pieces so the loading line can show how far it has got.
async function fetchWithProgress(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(res.status);
  const total = Number(res.headers.get('content-length')) || 0;
  if (!res.body || !total) return res.arrayBuffer();
  const reader = res.body.getReader(), parts = [];
  let got = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    parts.push(value);
    got += value.length;
    bootProgress(app, Math.min(got / total, 0.99));
  }
  return new Blob(parts).arrayBuffer();
}
async function bootKernel(kernel) {
  try {
    // Some hosts decode gzip on the way; only decompress if the bytes are still gzipped.
    const raw = await fetchWithProgress('./occ.gz.wasm');
    const gz = new Uint8Array(raw, 0, 2);
    const wasmBinary = gz[0] === 0x1f && gz[1] === 0x8b
      ? await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()
      : raw;
    bootProgress(app, null);
    await (await kernel).loadKernel({ wasmBinary });
  } catch {
    bootProgress(app, null);
    await (await kernel).loadKernel();
  }
}
// The download starts at once; the app's code loads alongside it.
const kernel = import('./src/Kernel.js');
const rest = Promise.all([import('./src/app/LocalBackend.js'), import('./src/app/App.js')]);
await bootKernel(kernel);
const [{ LocalBackend }, { mount }] = await rest;
window.__w3d = await mount(app, new LocalBackend());
</script>
</body>
</html>
