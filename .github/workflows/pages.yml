name: Pages
# Publishes the browser build (web/) to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # No build step: the page is served straight from web/. The OCCT wasm ships gzipped
      # next to index.html as occ.gz.wasm, which index.html decompresses itself.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp web/index.html _site/
          cp -r web/src _site/
          gzip -9 -c web/node_modules/replicad-opencascadejs/dist/replicad_single.wasm > _site/occ.gz.wasm
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
