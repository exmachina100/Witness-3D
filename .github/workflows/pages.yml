name: Pages
# Publishes the browser build (web/) to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Assemble site
        run: |
          mkdir -p _site/node_modules/replicad-opencascadejs
          mkdir -p _site/node_modules/@nasedkinpv/opensubdiv-wasm
          cp web/index.html _site/
          cp -r web/src _site/
          cp -r web/node_modules/replicad-opencascadejs/dist _site/node_modules/replicad-opencascadejs/
          cp -r web/node_modules/@nasedkinpv/opensubdiv-wasm/dist _site/node_modules/@nasedkinpv/opensubdiv-wasm/
          test -s _site/node_modules/replicad-opencascadejs/dist/replicad_single.js
          test -s _site/node_modules/replicad-opencascadejs/dist/replicad_single.wasm
          test -s _site/node_modules/@nasedkinpv/opensubdiv-wasm/dist/opensubdiv.mjs
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
