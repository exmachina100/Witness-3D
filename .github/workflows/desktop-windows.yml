# Builds the Windows installers (NSIS .exe and .msi) of the desktop app and publishes them as a
# GitHub release, so the latest desktop build is one download away. Run it from the Actions tab
# (Run workflow), or push a tag named desktop-v*.
name: desktop-windows
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install UI dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build the installers (compiles OpenCascade the first time)
        working-directory: apps/desktop
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: witness-3d-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in desktop-v*) ;; *) tag="desktop-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" ;; esac
          gh release create "$tag" target/release/bundle/nsis/*.exe target/release/bundle/msi/*.msi \
            --target "$GITHUB_SHA" --title "Witness 3D desktop for Windows ($tag)" \
            --notes "Windows installers built from ${GITHUB_SHA}. Download the .exe (setup) and run it; the .msi installs the same app."
