[package]
name = "w3d-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Witness 3D desktop app: the Rust modeling core behind a Three.js viewport."

[lib]
name = "w3d_desktop"
path = "src/lib.rs"

[[bin]]
name = "witness-3d"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
glam = "0.24"
w3d-kernel = { path = "../../../crates/w3d-kernel" }

[dev-dependencies]
serde_json = "1"

[features]
# Serve the built UI from inside the binary instead of the Vite dev server. `npm run tauri build`
# turns this on; set it yourself when running `cargo build` directly.
custom-protocol = ["tauri/custom-protocol"]
